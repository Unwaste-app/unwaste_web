  if(msg){$('#rerr',m).textContent=msg;$('#rerr',m).classList.remove('hidden');return}
  if(t){m.querySelector('div').innerHTML='<div class="text-center"><div class="w-14 h-14 mx-auto rounded-full bg-discount-green/10 text-discount-green flex items-center justify-center mb-3"><span class="material-symbols-outlined text-[32px]">hourglass_top</span></div><h2 class="text-headline-sm font-bold">Pendaftaran diterima</h2><p class="text-body-md text-text-muted mt-1 mb-4">Kami verifikasi <b>'+esc(v('rn'))+'</b> dalam 1×24 jam. Sementara itu, coba portal dengan akun demo.</p><button class="w-full py-3 rounded-xl bg-primary text-on-primary text-label-lg font-bold">Coba akun demo</button></div>';$('button',m).onclick=()=>{m.remove();$('#demo').click()}}
  else{store(SKEY,{role:'konsumen',name:v('rn'),id:v('re')});location.href='home.html'}}};
paint();
</script>

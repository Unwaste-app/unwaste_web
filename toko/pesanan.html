<!DOCTYPE html>
<html lang="id">
  <head>
    <script src="../assets/static-shim.js"></script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pesanan Masuk · Unwaste Mitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>html,body{margin:0}body{overscroll-behavior:none}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}input[type=range]{accent-color:#2B6085}:focus-visible{outline:2px solid #5D8BB6;outline-offset:2px}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/tailwind-config.js"></script>
    <script src="shared.js"></script>
  </head>
  <body>
    <main></main>
    <script>

const {rp,esc,icon,$,$$}=UWT;
const q=new URLSearchParams(location.search);
let tab='aktif',hi=q.get('code')||'';
const inTab=(o,t)=>t==='aktif'?(o.status==='Baru'||o.status==='Siap'):t==='selesai'?o.status==='Selesai':o.status==='Batal';
UWT.boot({active:'pesanan',
render(){
 const D=UWT.db(),s=D.shop,st=UWT.stats(),os=st.os;
 if(hi){const o=os.find(x=>x.code===hi);if(o)tab=inTab(o,'aktif')?'aktif':o.status==='Selesai'?'selesai':'batal'}
 const cnt=t=>os.filter(o=>inTab(o,t)).length;
 const list=os.filter(o=>inTab(o,tab));
 const online=st.ok.filter(o=>!UWT.payInfo(o).cod),cod=st.ok.filter(o=>UWT.payInfo(o).cod);
 const sum=a=>a.reduce((x,o)=>x+o.price*o.qty,0);
 const pctDone=st.ok.length?Math.round(st.done.length/st.ok.length*100):0;
 $('main').innerHTML=`
 <div class="mb-5"><p class="text-label-md text-primary font-bold uppercase tracking-wide">${esc(s.name)}</p><h1 class="text-headline-md lg:text-headline-lg font-bold">Pesanan Masuk & Pengambilan</h1><p class="text-body-md text-on-surface-variant max-w-2xl mt-1">Pantau reservasi hari ini, siapkan paketnya, lalu verifikasi kode konsumen saat mereka datang.</p></div>
 <section class="rounded-2xl bg-primary text-on-primary p-5 lg:p-6 flex flex-col lg:flex-row lg:items-center gap-4 justify-between">
  <div><p class="text-label-md font-bold uppercase tracking-wide text-primary-fixed-dim flex items-center gap-1.5">${icon('bolt','text-[16px]')}Validasi cepat kasir</p><h2 class="text-headline-sm font-bold mt-1">Ketik kode reservasi konsumen</h2><p class="text-body-sm text-on-primary-container mt-1">Kode ada di aplikasi konsumen, menu Riwayat Pesanan (contoh: UW-4821).</p></div>
  <form id="vForm" class="flex flex-col sm:flex-row gap-2 lg:w-[520px]"><label class="sr-only" for="vCode">Kode reservasi</label><input id="vCode" maxlength="8" autocomplete="off" placeholder="UW-XXXX" class="flex-1 rounded-xl bg-white text-on-surface px-4 py-3 text-title-md font-bold tracking-widest uppercase placeholder:font-normal placeholder:text-outline-variant"/><button class="px-5 py-3 rounded-xl bg-sky-blue text-on-primary-fixed text-label-lg font-bold inline-flex items-center justify-center gap-2 whitespace-nowrap">${icon('check_circle','text-[20px]')}Validasi</button></form></section>
 <div class="grid lg:grid-cols-[minmax(0,1fr)_370px] gap-4 mt-4 items-start">
  <section class="min-w-0"><div class="flex gap-1 p-1 rounded-xl bg-surface-container overflow-x-auto mb-4" role="tablist">${[['aktif','Menunggu Diambil'],['selesai','Sudah Diambil'],['batal','Dibatalkan']].map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}" class="flex-1 px-4 py-2.5 rounded-lg text-label-lg font-semibold whitespace-nowrap ${tab===k?'bg-surface-card text-primary shadow-sm':'text-text-muted'}">${t} <span class="ml-1 text-label-sm px-1.5 py-0.5 rounded-full ${tab===k&&k==='aktif'&&cnt(k)?'bg-discount-orange text-white':'bg-surface-dim text-on-surface-variant'}">${cnt(k)}</span></button>`).join('')}</div>
   <div class="flex flex-col gap-4">${list.length?list.map(o=>{const c=UWT.statusChip(o.status),p=UWT.payInfo(o);
    return `<article id="o-${o.code}" class="bg-surface-card rounded-2xl p-4 lg:p-5 shadow-[0_1px_8px_rgba(0,0,0,.04)] ${hi===o.code?'ring-2 ring-primary':''}">
     <div class="flex flex-wrap items-center gap-2 justify-between"><div class="flex flex-wrap items-center gap-2"><h3 class="text-title-md font-bold text-primary tracking-wider">${o.code}</h3><span class="text-label-sm font-bold px-2 py-0.5 rounded-full ${c[1]}">${c[0]}</span><span class="text-label-sm font-semibold px-2 py-0.5 rounded-full ${p.cls}">${esc(p.label)}</span></div><span class="text-body-sm text-text-muted inline-flex items-center gap-1">${icon('schedule','text-[16px]')}Ambil ${esc(o.slot)} WIB · masuk ${UWT.ago(o.ts)}</span></div>
     <div class="flex gap-4 mt-3"><div class="w-20 h-20 rounded-xl overflow-hidden shrink-0 bg-surface-container">${o.img?`<img src="${o.img}" alt="" class="w-full h-full object-cover"/>`:''}</div>
      <div class="min-w-0 flex-1"><div class="flex justify-between gap-3"><p class="text-title-sm font-bold leading-snug">${o.qty}× ${esc(o.name)}</p><p class="text-title-sm font-bold text-primary whitespace-nowrap">${rp(o.price*o.qty)}</p></div>
       <p class="text-body-sm text-text-muted mt-1 inline-flex items-center gap-1">${icon('person','text-[16px]')}${esc(o.buyer)}${o.src==='app'?' · dari aplikasi':''}</p>
       ${o.note?`<p class="mt-2 rounded-lg bg-surface-container-low px-3 py-2 text-body-sm"><b>Catatan:</b> “${esc(o.note)}”</p>`:''}
       ${p.cod&&o.status!=='Selesai'&&o.status!=='Batal'?`<p class="mt-2 text-body-sm font-semibold text-on-error-container bg-error-container rounded-lg px-3 py-2 inline-flex items-center gap-1.5">${icon('payments','text-[18px]')}Tagih ${rp(o.price*o.qty)} di kasir saat serah terima</p>`:''}</div></div>
     <div class="flex flex-wrap justify-end gap-2 mt-4 pt-3 border-t border-border-subtle">
      ${o.status==='Baru'?`<button data-cancel="${o.code}" class="px-3 py-2 rounded-xl text-error text-label-lg font-semibold hover:bg-error-container">Batalkan</button>`:''}
      <button data-detail="${o.code}" class="px-4 py-2 rounded-xl bg-surface-container text-primary text-label-lg font-bold">Rincian</button>
      ${o.status==='Baru'?`<button data-ready="${o.code}" class="px-4 py-2 rounded-xl bg-sky-blue/60 text-on-primary-fixed text-label-lg font-bold inline-flex items-center gap-1.5">${icon('inventory','text-[18px]')}Tandai Siap Diambil</button>`:''}
      ${o.status==='Baru'||o.status==='Siap'?`<button data-verify="${o.code}" class="px-4 py-2 rounded-xl bg-primary text-on-primary text-label-lg font-bold inline-flex items-center gap-1.5">${icon('done_all','text-[18px]')}Verifikasi Pengambilan</button>`:''}
      ${o.status==='Selesai'&&o.doneTs?`<span class="mr-auto text-body-sm text-discount-green inline-flex items-center gap-1">${icon('task_alt','text-[18px]')}Diserahkan pukul ${UWT.hhmm(o.doneTs)}</span>`:''}
     </div></article>`}).join(''):`<div class="bg-surface-card rounded-2xl p-10 text-center"><span class="material-symbols-outlined text-[44px] text-text-muted">${tab==='aktif'?'inbox':tab==='selesai'?'task_alt':'cancel'}</span><p class="text-title-md font-bold mt-2">${tab==='aktif'?'Tidak ada pesanan menunggu':tab==='selesai'?'Belum ada yang diambil':'Tidak ada pesanan dibatalkan'}</p><p class="text-body-md text-text-muted">${tab==='aktif'?'Pesanan baru dari konsumen akan muncul di sini otomatis.':''}</p></div>`}</div></section>
  <aside class="flex flex-col gap-4">
   <section class="bg-surface-card rounded-2xl p-5 shadow-[0_1px_8px_rgba(0,0,0,.04)]"><p class="text-label-md text-text-muted uppercase tracking-wide">Rekonsiliasi kas hari ini</p><h2 class="text-headline-sm font-bold mb-3">Ringkasan Kasir</h2>
    <div class="rounded-xl bg-surface-container-low p-4"><div class="flex justify-between text-body-sm text-text-muted"><span>Total pesanan aktif</span><b class="text-on-surface">${rp(st.rev)}</b></div><div class="flex justify-between items-end mt-2"><span class="text-body-md">Sudah diterima</span><b class="text-headline-md text-primary">${rp(st.revDone)}</b></div><p class="text-body-sm text-discount-green mt-1">Dicairkan harian ke rekening ${esc(s.bank)} terdaftar.</p></div>
    <div class="flex flex-col gap-2 mt-4 text-body-md"><div class="flex justify-between"><span class="inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-discount-green"></span>Bayar lewat aplikasi (${online.length})</span><b>${rp(sum(online))}</b></div><div class="flex justify-between"><span class="inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-discount-orange"></span>Tunai di kasir (${cod.length})</span><b>${rp(sum(cod))}</b></div><div class="flex justify-between"><span class="inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-primary"></span>Porsi terselamatkan</span><b class="text-discount-green">${st.porDone} porsi · ${st.co2.toFixed(1).replace('.',',')} kg CO₂e</b></div></div>
    <div class="mt-4 rounded-xl bg-surface-container p-3 flex items-center gap-3"><div class="relative w-14 h-14 shrink-0"><svg viewBox="0 0 36 36" class="w-14 h-14 -rotate-90"><circle cx="18" cy="18" r="15" fill="none" stroke="#fff" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="#2B6085" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(pctDone*94.2/100).toFixed(1)} 94.2"/></svg><span class="absolute inset-0 flex items-center justify-center text-label-md font-bold">${pctDone}%</span></div><p class="text-body-sm"><b class="text-label-lg">${st.done.length} dari ${st.ok.length} pesanan diambil</b><br/>${st.waiting.length} masih menunggu diserahkan.</p></div></section>
   <section class="bg-surface-card rounded-2xl p-5 shadow-[0_1px_8px_rgba(0,0,0,.04)]"><h2 class="text-headline-sm font-bold flex items-center gap-2 mb-3">${icon('verified_user','text-primary')}SOP Kasir & Serah Terima</h2><ol class="flex flex-col gap-3 text-body-sm text-on-surface-variant">
    ${[['Cek kode','Cocokkan kode pembeli dengan sistem sebelum paket diserahkan.'],['Kemasan ramah lingkungan','Utamakan kertas kraft atau kantong yang dibawa konsumen.'],['Info alergen','Sampaikan alergen & saran konsumsi terbaik (hari ini).'],['Pembayaran tunai','Pesanan “Bayar di Toko” wajib ditagih lebih dulu, lalu verifikasi.']].map(([t,d])=>`<li class="flex gap-2">${icon('check_circle','text-discount-green text-[20px] shrink-0')}<span><b class="text-on-surface">${t}:</b> ${d}</span></li>`).join('')}</ol></section>
   <section class="rounded-2xl bg-surface-container p-5 flex items-center gap-3 justify-between"><div><b class="text-label-lg">Ada sisa roti mendadak?</b><p class="text-body-sm text-on-surface-variant">Tambah porsi dalam beberapa detik.</p></div><a href="listing.html?new=1" class="px-4 py-2.5 rounded-xl bg-primary text-on-primary text-label-lg font-bold whitespace-nowrap">+ Listing Cepat</a></section>
  </aside></div>`;
 if(hi)setTimeout(()=>{const e=$('#o-'+hi);e&&e.scrollIntoView({block:'center',behavior:'smooth'});hi=''},80);
},
after(){
 $('#vForm').onsubmit=e=>{e.preventDefault();UWT.verify($('#vCode').value);};
 $$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;UWT.refresh()});
 $$('[data-ready]').forEach(b=>b.onclick=()=>{UWT.setStatus(b.dataset.ready,'Siap');UWT.toast('Ditandai siap diambil');UWT.refresh()});
 $$('[data-cancel]').forEach(b=>b.onclick=()=>UWT.confirm('Batalkan pesanan?','Pesanan '+b.dataset.cancel+' dibatalkan dan stok porsi dikembalikan. Konsumen akan melihat pesanannya dibatalkan.','Ya, batalkan',()=>{UWT.setStatus(b.dataset.cancel,'Batal');UWT.toast('Pesanan dibatalkan, stok dikembalikan');UWT.refresh()},true));
 $$('[data-verify]').forEach(b=>b.onclick=()=>{const code=b.dataset.verify;
  const m=UWT.modal(`<h2 class="text-headline-sm font-bold mb-1">Verifikasi ${code}</h2><p class="text-body-md text-text-muted mb-4">Minta konsumen menunjukkan kode di aplikasinya, lalu ketik di sini untuk memastikan pesanannya benar.</p><input id="mCode" maxlength="8" autocomplete="off" placeholder="UW-XXXX" class="w-full mb-4 rounded-xl bg-surface-container-low border border-transparent focus:border-primary px-4 py-3 text-title-md font-bold tracking-widest uppercase placeholder:font-normal"/><div class="grid grid-cols-2 gap-2"><button id="mNo" class="py-3 rounded-xl bg-surface-container text-label-lg font-bold">Batal</button><button id="mYes" class="py-3 rounded-xl bg-primary text-on-primary text-label-lg font-bold">Cocokkan</button></div>`);
  $('#mNo',m).onclick=UWT.close;const go=()=>UWT.verify($('#mCode',m).value,code);$('#mYes',m).onclick=go;$('#mCode',m).onkeydown=e=>{if(e.key==='Enter')go()}});
 $$('[data-detail]').forEach(b=>b.onclick=()=>{const o=UWT.orders().find(x=>x.code===b.dataset.detail),p=UWT.payInfo(o),c=UWT.statusChip(o.status);
  const row=(a,v)=>`<div class="flex justify-between gap-4 py-2 border-b border-border-subtle last:border-0"><span class="text-text-muted">${a}</span><b class="text-right">${v}</b></div>`;
  const m=UWT.modal(`<h2 class="text-headline-sm font-bold mb-3">Rincian ${o.code}</h2><div class="text-body-md mb-4">${row('Status',c[0])}${row('Pembeli',esc(o.buyer))}${row('Pesanan',o.qty+'× '+esc(o.name))}${row('Harga satuan',rp(o.price)+' <s class="font-normal text-text-muted">'+rp(o.orig)+'</s>')}${row('Total',rp(o.price*o.qty))}${row('Jam ambil',esc(o.slot)+' WIB')}${row('Pembayaran',p.cod?'Bayar di toko (tunai/QRIS statis)':esc(o.pay)+' · lunas')}${row('Dipesan',UWT.hhmm(o.ts)+' ('+UWT.ago(o.ts)+')')}${o.note?row('Catatan',esc(o.note)):''}</div><button id="dOk" class="w-full py-3 rounded-xl bg-primary text-on-primary text-label-lg font-bold">Tutup</button>`);$('#dOk',m).onclick=UWT.close});
}});
UWT.refreshHook=0;

</script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">
  <head>
    <script src="../assets/static-shim.js"></script>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Profil Toko · Unwaste Mitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>html,body{margin:0}body{overscroll-behavior:none}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}input[type=range]{accent-color:#2B6085}:focus-visible{outline:2px solid #5D8BB6;outline-offset:2px}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/tailwind-config.js"></script>
    <script src="shared.js"></script>
  </head>
  <body>
    <main></main>
    <script>

const {rp,esc,icon,$,$$}=UWT;
const sw=(id,on,label,desc)=>`<label class="flex items-center justify-between gap-4 py-3 cursor-pointer"><span><b class="text-label-lg block">${label}</b><span class="text-body-sm text-text-muted">${desc}</span></span><span class="relative inline-block w-11 h-6 shrink-0"><input type="checkbox" id="${id}" ${on?'checked':''} class="peer sr-only"/><span class="absolute inset-0 rounded-full bg-outline-variant peer-checked:bg-discount-green transition-colors peer-focus-visible:ring-2 ring-primary"></span><span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span></span></label>`;
const fld=(id,label,val,ph,type,extra)=>`<div><label class="text-label-lg font-bold" for="${id}">${label}</label><input id="${id}" type="${type||'text'}" value="${esc(val)}" placeholder="${ph||''}" ${extra||''} class="mt-1.5 w-full rounded-xl bg-surface-container-low border border-transparent focus:border-primary px-4 py-3"/><p class="err hidden text-body-sm text-error mt-1" data-for="${id}"></p></div>`;
const card=(t,ic,body)=>`<section class="bg-surface-card rounded-2xl p-5 lg:p-6 shadow-[0_1px_8px_rgba(0,0,0,.04)]"><h2 class="text-headline-sm font-bold flex items-center gap-2 mb-4">${icon(ic,'text-primary')}${t}</h2>${body}</section>`;
UWT.boot({active:'profil',
render(){
 const s=UWT.db().shop;
 $('main').innerHTML=`
 <div class="mb-5"><p class="text-label-md text-primary font-bold uppercase tracking-wide">Akun mitra</p><h1 class="text-headline-md lg:text-headline-lg font-bold">Profil Toko</h1><p class="text-body-md text-on-surface-variant mt-1">Info ini tampil di halaman detail menu konsumen.</p></div>
 <form id="pForm" novalidate class="grid lg:grid-cols-2 gap-4 items-start">
  <div class="flex flex-col gap-4">
  ${card('Informasi toko','storefront',`<div class="flex flex-col gap-4">${fld('pName','Nama toko',s.name,'','text','maxlength="60"')}${fld('pAddr','Alamat lengkap',s.address)}<div class="grid sm:grid-cols-2 gap-4">${fld('pPhone','No. WhatsApp usaha',s.phone,'0812-xxxx-xxxx','tel')}${fld('pMail','Email bisnis',s.email,'','email')}</div>
   <div class="flex items-center gap-3 rounded-xl bg-discount-green/10 text-discount-green px-4 py-3 text-label-lg font-semibold">${icon('verified')}Mitra terverifikasi Unwaste</div></div>`)}
  ${card('Jam operasional pengambilan','schedule',`<div class="grid sm:grid-cols-3 gap-4"><div><label class="text-label-lg font-bold" for="pFrom">Pickup mulai</label><input id="pFrom" type="time" value="${s.from}" class="mt-1.5 w-full rounded-xl bg-surface-container-low px-4 py-3"/></div><div><label class="text-label-lg font-bold" for="pTo">Pickup selesai</label><input id="pTo" type="time" value="${s.to}" class="mt-1.5 w-full rounded-xl bg-surface-container-low px-4 py-3"/></div><div><label class="text-label-lg font-bold" for="pClose">Toko tutup</label><input id="pClose" type="time" value="${s.closeAt}" class="mt-1.5 w-full rounded-xl bg-surface-container-low px-4 py-3"/></div></div><p class="err hidden text-body-sm text-error mt-2" data-for="time"></p><p class="text-body-sm text-text-muted mt-3">Jam ini jadi default saat membuat listing baru.</p>
   <div class="mt-2 divide-y divide-border-subtle">${sw('pHalal',s.halal,'Bersertifikat halal','Tampilkan label “Halal” pada profil toko.','')}</div>`)}
  </div><div class="flex flex-col gap-4">
  ${card('Rekening pencairan','account_balance',`<div class="flex flex-col gap-4"><div><label class="text-label-lg font-bold" for="pBank">Bank</label><select id="pBank" class="mt-1.5 w-full rounded-xl bg-surface-container-low px-4 py-3">${['BCA','Mandiri','BNI','BRI','BSI','CIMB Niaga'].map(b=>`<option ${b===s.bank?'selected':''}>${b}</option>`).join('')}</select></div>${fld('pAcc','Nomor rekening',s.acc,'','text','inputmode="numeric"')}${fld('pAccName','Nama pemilik rekening',s.accName)}</div><p class="text-body-sm text-text-muted mt-3">Pencairan dilakukan harian dari pesanan yang sudah diambil.</p>`)}
  ${card('Notifikasi','notifications',`<div class="divide-y divide-border-subtle">${sw('nOrder',s.notif.order,'Pesanan baru','Beri tahu saat ada reservasi masuk.')}${sw('nStock',s.notif.stock,'Stok hampir habis','Ingatkan saat sisa ≤ 2 porsi.')}${sw('nReport',s.notif.report,'Ringkasan harian','Laporan penjualan setiap tutup toko.')}</div>`)}
  ${card('Akun','manage_accounts',`<div class="flex flex-col sm:flex-row gap-3"><button type="button" id="out" class="flex-1 py-3 rounded-xl bg-error-container text-on-error-container text-label-lg font-bold inline-flex items-center justify-center gap-2">${icon('logout','text-[20px]')}Keluar</button><button type="button" id="rst" class="flex-1 py-3 rounded-xl bg-surface-container text-on-surface-variant text-label-lg font-bold inline-flex items-center justify-center gap-2">${icon('restart_alt','text-[20px]')}Reset data demo</button></div>`)}
  </div>
  <div class="lg:col-span-2 flex justify-end"><button class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-primary text-on-primary text-label-lg font-bold inline-flex items-center justify-center gap-2 shadow-md">${icon('save','text-[20px]')}Simpan Perubahan</button></div>
 </form>`;
},
after(){
 $('#out').onclick=()=>UWT.confirm('Keluar dari portal?','Kamu akan kembali ke halaman login.','Keluar',UWT.logout);
 $('#rst').onclick=()=>UWT.confirm('Reset data demo?','Listing dan pesanan toko dikembalikan ke contoh awal, termasuk pesanan toko ini dari aplikasi konsumen.','Reset',()=>{UWT.reset();UWT.toast('Data demo direset');UWT.refresh()},true);
 $('#pForm').onsubmit=e=>{e.preventDefault();const g=i=>$('#'+i).value.trim(),er={};
  if(!g('pName'))er.pName='Nama toko wajib diisi.';if(!g('pAddr'))er.pAddr='Alamat wajib diisi.';
  if(!/^[0-9+\-\s]{9,16}$/.test(g('pPhone')))er.pPhone='Nomor WhatsApp tidak valid.';
  if(!/^\S+@\S+\.\S+$/.test(g('pMail')))er.pMail='Format email tidak valid.';
  if(!g('pFrom')||!g('pTo')||g('pFrom')>=g('pTo'))er.time='Pickup selesai harus setelah pickup mulai.';
  else if(g('pClose')&&g('pClose')<g('pTo'))er.time='Jam toko tutup tidak boleh sebelum pickup selesai.';
  if(!/^\d{6,20}$/.test(g('pAcc').replace(/\s/g,'')))er.pAcc='Nomor rekening 6–20 digit angka.';
  if(!g('pAccName'))er.pAccName='Nama pemilik rekening wajib diisi.';
  $$('.err').forEach(x=>{const m=er[x.dataset.for];x.textContent=m||'';x.classList.toggle('hidden',!m)});
  const k=Object.keys(er)[0];if(k){UWT.toast('Periksa isian yang bertanda merah');const t=$('[data-for='+k+']');t&&t.scrollIntoView({block:'center',behavior:'smooth'});return}
  const s=UWT.db().shop;Object.assign(s,{name:g('pName'),address:g('pAddr'),phone:g('pPhone'),email:g('pMail'),from:g('pFrom'),to:g('pTo'),closeAt:g('pClose'),halal:$('#pHalal').checked,bank:$('#pBank').value,acc:g('pAcc').replace(/\s/g,''),accName:g('pAccName'),notif:{order:$('#nOrder').checked,stock:$('#nStock').checked,report:$('#nReport').checked}});
  s.short=s.name.replace(/\s+(Kemanggisan|Margonda)$/i,'');UWT.save();UWT.toast('Profil toko disimpan');UWT.refresh()}
}});

</script>
  </body>
</html>
